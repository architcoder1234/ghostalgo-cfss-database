<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CFSS Admin</title><link rel="stylesheet" href="style.css"></head><body><header><div class="nav"><a class="brand" href="index.html">🚗 <b>CFSS 2023</b><small>ADMIN</small></a><nav><a href="index.html">Public Site</a></nav></div></header><main style="max-width:900px;padding-top:50px"><div style="background:#12161c;border:1px solid #28303a;border-radius:13px;padding:22px"><h2>🔐 Admin prototype</h2><p style="color:#9aa5b1;line-height:1.6">This page is for local testing only. Before public deployment, connect Supabase Auth, Storage and Row Level Security. Never publish a service-role key.</p><input id="id" type="number" placeholder="Car ID"><input id="image" type="file" accept="image/*"><br><br><button onclick="save()">Save image locally</button></div></main><script src="cars.js"></script><script>function save(){let id=+document.getElementById("id").value,f=document.getElementById("image").files[0];if(!id||!f)return alert("Choose a car ID and image.");let r=new FileReader();r.onload=()=>{let x=JSON.parse(localStorage.getItem("cfss_edits")||"{}");x[id]={...(x[id]||{}),image:r.result};localStorage.setItem("cfss_edits",JSON.stringify(x));alert("Saved locally. Supabase is required for a real public admin system.")};r.readAsDataURL(f)}</script></body></html>
